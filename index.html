<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day 3 - 4</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark-subtle">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><img src="img/Logo.png" alt="logo"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">My Project</a>
            </li>
          </ul>
          <button type="button" class="btn btn-dark btn-sm">Contact Me</button>
        </div>
      </div>
    </nav>

    <section class="form my-5">
      <div class="fw-bold fs-1 text-center">GET IN TOUCH</div>
      <form class=" py-5 w-50 mx-auto">
        <div class="mb-4">
          <label for="name" class="form-label mb-0">Name</label>
          <input type="text" class="form-control shadow" id="name" required />
        </div>
        <div class="mb-4">
          <label for="email" class="form-label mb-0">Email</label>
          <input type="email" class="form-control shadow" id="email" required>
        </div>
        </div>
        <div class="mb-4">
          <label for="phone" class="form-label mb-0">Phone Number</label>
          <input type="number" class="form-control shadow" id="phone" required/>
        </div>
        <div class="mb-4">
          <label for="validationCustom04" class="form-label mb-0">Subject</label>
          <select class="form-select" aria-label="Default select example" required>
            <option selected disabled value="">Choose...</option>
            <option value="1">Subject 1</option>
            <option value="2">Subject 2</option>
            <option value="3">Subject 3</option>
          </select>
        </div>
        <div class="mb-4">
          <label for="message" class="form-label mb-0">Your Message</label>
          <textarea class="form-control" placeholder="Write your message" id="floatingTextarea2" style="height: 100px" required></textarea>
        </div>
        <button type="submit" class="btn d-block btn-dark float-end mt-3 py-1 px-4 rounded-pill">Submit</button>
      </form>
    </section>

    <!-- JavaScript -->
    <script src="script.js"></script>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
